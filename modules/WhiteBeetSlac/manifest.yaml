description: WhiteBeet SLAC implementation using FreeV2G library (Python module)
provides:
  main:
    interface: slac
    description: SLAC interface implementation using WhiteBeet API in Python.
    config:
      device:
        description: Ethernet device used for communication with WhiteBeet (e.g., eth0).
        type: string
        default: eth0
      whitebeet_mac:
        description: MAC address of the WhiteBeet device.
        type: string
        default: "c4:93:00:34:a4:e4"
      slac_timeout_ms:
        description: Timeout for SLAC matching process in milliseconds.
        type: integer
        default: 50000
      publish_mac_on_match_cnf:
        description: Publish the EV MAC address when matching is confirmed.
        type: boolean
        default: true
      debug_auto_enable:
        description: >-
          Auto-enable SLAC and simulate BCD state on startup for testing without EvseManager.
          WARNING: Only for debugging/testing. Set to false in production.
        type: boolean
        default: false
