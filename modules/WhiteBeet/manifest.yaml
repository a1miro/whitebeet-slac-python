description: WhiteBeet SLAC and ISO15118 Charger - Combined module using WhiteBeet's internal SLAC and V2G
provides:
  slac:
    interface: slac
    description: ISO15118-3 SLAC implementation using WhiteBeet hardware
    config:
      device:
        description: Ethernet device used for communication with WhiteBeet (e.g., eth0)
        type: string
        default: eth0
      whitebeet_mac:
        description: MAC address of the WhiteBeet device
        type: string
        default: "c4:93:00:34:a4:e4"
      slac_timeout_ms:
        description: SLAC matching timeout in milliseconds
        type: integer
        default: 50000
      publish_mac_on_match_cnf:
        description: Publish EV MAC address when SLAC matching is confirmed
        type: boolean
        default: true
  charger:
    interface: ISO15118_charger
    description: ISO15118 charger implementation using WhiteBeet's internal V2G stack
    config:
      payment_enable_eim:
        description: Enable External Identification Means (EIM) payment
        type: boolean
        default: true
      payment_enable_contract:
        description: Enable contract-based payment (PnC)
        type: boolean
        default: false
      ac_nominal_voltage:
        description: AC nominal voltage in volts
        type: number
        default: 230
      free_service:
        description: Offer free charging service
        type: boolean
        default: true
