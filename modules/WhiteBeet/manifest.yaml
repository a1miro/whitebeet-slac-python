description: WhiteBeet SLAC and ISO15118 Charger - Combined module using WhiteBeet's internal SLAC and V2G
provides:
  v2g:
    interface: V2G
    description: V2G interface using FreeV2G EVSE command structure
    config:
      evse_id_DIN:
        description: EVSE ID (DIN format)
        type: string
        default: '+49*123*456*789'
      evse_id_ISO:
        description: EVSE ID (ISO format)
        type: string
        default: 'DE*A23*E45B*78C'
      protocol:
        description: Supported protocols
        type: list
        default: [0, 1]
      payment_method:
        description: Supported payment methods
        type: list
        default: [0]
      energy_transfer_mode:
        description: Supported energy transfer modes
        type: list
        default: [0, 1, 2, 3, 4, 5]
      certificate_installation_support:
        description: Certificate installation support
        type: boolean
        default: false
      certificate_update_support:
        description: Certificate update support
        type: boolean
        default: false
  v2g:
    interface: V2G
    description: V2G implementation using FreeV2G
    config:
      device:
        description: Ethernet device used for communication with WhiteBeet (e.g., eth0)
        type: string
        default: eth0
      whitebeet_mac:
        description: MAC address of the WhiteBeet device
        type: string
        default: "c4:93:00:34:a4:e4"
      payment_enable_eim:
        description: Enable External Identification Means (EIM) payment
        type: boolean
        default: true
      payment_enable_contract:
        description: Enable contract-based payment (PnC)
        type: boolean
        default: false
      ac_nominal_voltage:
        description: AC nominal voltage in volts
        type: number
        default: 230
      free_service:
        description: Offer free charging service
        type: boolean
        default: true
metadata:
