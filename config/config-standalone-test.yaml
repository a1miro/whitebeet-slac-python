# WhiteBeet SLAC - Standalone Test Configuration
# Minimal configuration for testing WhiteBeet SLAC module without full EvseManager
# This uses manual trigger mode - you'll need to call commands to enable SLAC

active_modules:
  whitebeet_slac:
    module: WhiteBeetSlac
    config_implementation:
      main:
        device: eth0
        whitebeet_mac: "c4:93:00:34:a4:e2"
        slac_timeout_ms: 50000
        publish_mac_on_match_cnf: true

settings: {}

# Manual testing commands (use everest CLI or API):
# 1. Enable SLAC:
#    everest-cli call whitebeet_slac main reset '{"enable": true}'
# 2. Simulate vehicle connection (enter BCD state):
#    everest-cli call whitebeet_slac main enter_bcd '{}'
# 3. Simulate vehicle disconnection:
#    everest-cli call whitebeet_slac main leave_bcd '{}'
