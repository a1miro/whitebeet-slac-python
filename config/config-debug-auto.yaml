# WhiteBeet SLAC - Debug Auto-Enable Configuration
# This configuration automatically enables SLAC on startup for easy testing
# WARNING: Only for testing/debugging. Do NOT use in production!

active_modules:
  whitebeet_slac:
    module: WhiteBeetSlac
    config_implementation:
      main:
        device: eth0
        whitebeet_mac: "c4:93:00:34:a4:e2"
        slac_timeout_ms: 50000
        publish_mac_on_match_cnf: true
        debug_auto_enable: true  # Auto-enable SLAC for testing

settings: {}
