# WhiteBeet SLAC with Full Charging Stack - Simple Test Configuration
# Complete setup: SLAC → ISO15118 → Charging
# Uses basic security (no TLS) for easier testing

active_modules:
  # Authentication - Allows free charging for testing
  token_provider:
    module: DummyTokenProvider
    config_implementation:
      main:
        timeout: 10
        token: DEADBEEF
    connections:
      evse:
        - implementation_id: evse
          module_id: evse_manager

  token_validator:
    module: DummyTokenValidator
    config_implementation:
      main:
        sleep: 0.25
        validation_reason: Token seems valid
        validation_result: Accepted
    connections: {}

  auth:
    module: Auth
    config_module:
      connection_timeout: 10
      selection_algorithm: FindFirst
    connections:
      evse_manager:
        - implementation_id: evse
          module_id: evse_manager
      token_provider:
        - implementation_id: main
          module_id: token_provider
      token_validator:
        - implementation_id: main
          module_id: token_validator

  # EVSE Manager - Orchestrates the complete charging session
  evse_manager:
    module: EvseManager
    config_module:
      connector_id: 1
      evse_id: DE*PNX*E1234567*1
      evse_id_din: 49A80737A45678
      charge_mode: AC
      ac_nominal_voltage: 230
      max_current_import_A: 32
      max_current_export_A: 32
      payment_enable_eim: true
      payment_enable_contract: false
      ac_hlc_enabled: true
      ac_hlc_use_5percent: true
      ac_enforce_hlc: false
      has_ventilation: true
      session_logging: true
      session_logging_path: /tmp/everest-logs
      session_logging_xml: true
      disable_authentication: true  # Free service for testing
    connections:
      bsp:
        - implementation_id: board_support
          module_id: yeti_simulator
      slac:
        - implementation_id: main
          module_id: whitebeet_slac
      hlc:
        - implementation_id: charger
          module_id: iso15118_charger
      powermeter_grid_side:
        - implementation_id: powermeter
          module_id: yeti_simulator
      connector_lock:
        - implementation_id: connector_lock
          module_id: yeti_simulator

  # ISO15118-2 Charger Module - Handles V2G communication after SLAC
  iso15118_charger:
    module: EvseV2G
    config_module:
      device: eth0  # Same ethernet interface as WhiteBeet SLAC
      supported_ISO15118_2: true
      supported_DIN70121: false
      tls_security: prohibit  # Disable TLS for easier testing
    connections:
      security:
        - module_id: evse_security
          implementation_id: main

  # EvseSecurity - Required by EvseV2G even when TLS is disabled
  evse_security:
    module: EvseSecurity
    config_module:
      csms_ca_bundle: /tmp/everest-certs/ca/v2g/ca-bundle.pem
      mf_ca_bundle: /tmp/everest-certs/ca/mf/ca-bundle.pem
      csms_leaf_cert_directory: /tmp/everest-certs/leaf/csms
      csms_leaf_key_directory: /tmp/everest-certs/leaf/csms
      secc_leaf_cert_directory: /tmp/everest-certs/leaf/cso
      secc_leaf_key_directory: /tmp/everest-certs/leaf/cso
    connections: {}

  # WhiteBeet SLAC Module - Establishes PLC data link
  whitebeet_slac:
    module: WhiteBeetSlac
    config_implementation:
      main:
        device: eth0
        whitebeet_mac: "c4:93:00:34:a4:e2"
        slac_timeout_ms: 50000
        publish_mac_on_match_cnf: true
        debug_auto_enable: true  # Auto-enable for testing

  # Yeti Simulator - Simulates board support (CP states, relays, etc)
  yeti_simulator:
    module: YetiSimulator
    config_module:
      connector_id: 1
    connections: {}

settings: {}
