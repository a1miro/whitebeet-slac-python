# WhiteBeet SLAC - Full EVSE Configuration (Python Module)

active_modules:
  evse_manager:
    module: EvseManager
    config_module:
      connector_id: 1
      three_phases: false
      has_ventilation: false
      country_code: "DE"
      charge_mode: DC
      max_current_import_A: 32.0
      max_current_export_A: 0.0
    connections:
      slac:
        - module_id: whitebeet_slac
          implementation_id: main

  whitebeet_slac:
    module: WhiteBeetSlac
    config_module:
      device: eth0
      whitebeet_mac: "c4:93:00:34:a4:e4"
      slac_timeout_ms: 50000
      publish_mac_on_match_cnf: true

settings: {}
